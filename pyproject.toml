[project]
name = "passagen-cli"
version = "0.7.0"
description = "Manage paper PDFs and generate structured summaries"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "passagen-core>=0.7,<0.8",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
]

[tool.uv.sources]
passagen-core = { path = "../passagen-core", editable = true }

[project.scripts]
passagen = "passagen_cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.39,<2",
    "mypy>=1.18,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-xdist[psutil]>=3.8,<4",
    "ruff>=0.11,<1",
    "types-psutil>=7.2,<8",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end workflows excluded from the default local test run"]
addopts = [
    "--import-mode=importlib",
    "-m",
    "not slow",
    "--cov=passagen_cli",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["passagen_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
explicit_package_bases = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.hatch.build.targets.wheel]
packages = ["src/passagen_cli"]
