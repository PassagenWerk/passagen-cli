passagen:
  database_path: null
  debug: false

providers:
  healthcheck_timeout_seconds: 3
  crossref:
    enabled: true
    base_url: https://api.crossref.org
    # 建议填写联系邮箱以使用 Crossref polite pool。
    mailto: null
    timeout_seconds: 10
  arxiv:
    enabled: true
    base_url: https://export.arxiv.org
    timeout_seconds: 10
  citation_page:
    enabled: true
    # 仅请求明确允许的 HTTPS 来源页主机；不支持通配符。
    allowed_hosts:
      - www.usenix.org
    timeout_seconds: 10
  openalex:
    enabled: true
    base_url: https://api.openalex.org
    # 建议填写联系邮箱。
    mailto: null
    timeout_seconds: 10
  grobid:
    # GROBID health endpoint 是 <base_url>/api/isalive。
    base_url: http://localhost:8070
    timeout_seconds: 60
  llm:
    # 默认配置负责所有未在 tasks 中单独路由的 LLM 任务。
    default:
      # Passagen 会在 base_url 后添加 /chat/completions。
      base_url: https://api.deepseek.com/v1
      model: deepseek-flash-v4
      # Secret 只从环境变量读取，不写入 YAML。
      api_key_env: PASSAGEN_API_KEY
      timeout_seconds: 120
      max_context_window: 1000000
      flavor: deepseek
      reasoning: disable

pipeline:
  metadata:
    first_pages: 2
  parsing:
    # 没有 GROBID 时设置为 pymupdf。
    parser: auto
    min_text_characters: 10
  abstract_fixing:
    enabled: true
    max_output_tokens: 2000
    prompt_path: null
  summarization:
    # auto 根据上下文预算选择 full 或 hierarchical。
    strategy: auto
    chunk_max_input_tokens: 128000
    chunk_overlap_paragraphs: 1
    fact_max_output_tokens: 6000
    summary_max_output_tokens: 20000
    # null 使用 Core 内置 prompt。
    facts_prompt_path: null
    summary_prompt_path: null
    full_prompt_path: null
    reduce_prompt_path: null
    repair_prompt_path: null
  outlining:
    max_output_tokens: 40000
    prompt_path: null

assistant:
  rewrite_max_output_tokens: 1024
  answer_max_output_tokens: 8192
  truncated_response_max_attempts: 3
  max_history_messages: 10
  max_raw_sections: 3
  rewrite_prompt_path: null
  answer_prompt_path: null
  repair_prompt_path: null
